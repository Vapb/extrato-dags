[project]
name = "extrato-pipeline"
version = "0.1.0"
description = "Pipeline medallion para extratos bancários em PDF"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.13",
    "dagster-webserver>=1.13.13",
    "pandas>=2.0.0",
    "pymupdf4llm>=0.0.17",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "extrato_pipeline.definitions"
code_location_name = "extrato_pipeline"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "extrato_pipeline"

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.13",
    "pytest>=9.1.1",
]
