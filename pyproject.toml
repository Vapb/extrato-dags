[project]
name = "extrato-pipeline"
version = "0.1.0"
description = "Pipeline medallion para extratos bancários em PDF"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.13",
    "dagster-webserver>=1.13.13",
    "pandas>=2.0.0",
    "pymupdf4llm>=0.0.17",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "extrato_pipeline.definitions"
code_location_name = "extrato_pipeline"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "extrato_pipeline"

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = "pymupdf4llm"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.13",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.3.260530",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
